<!DOCTYPE html>
<html lang="en">
<head>
    <title>Advanced selectors

    </title>
    <style>
        input[type="text"]{
            border: 5px solid orange;
        }
        input[type = "password"]{
            border: 5px solid blue;
        }
        ul>li{
            color: blueviolet;
            font-family: cursive;
            font-size: 22px;
        }
        li:nth-child(2){
            color: rgba(0, 60, 255, 0.997);
            font-size: 25px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        a:hover{
            color: rgb(7, 218, 88);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <label>
        Enter your Name
    </label><br>
    <input type="text"><br>
    <label>
        Enter your password
    </label><br>
</input>
<input type="password">
<ul>
    <li>
        Juice
    </li>
    <li>
        Food
    </li>
    <li>
        Hot drink
    </li><br>
    <a href=https://chromewebstore.google.com/>Chrome web store</a>
</body>
</html>
